name: Validation and WAF smoke test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install validation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Static configuration and architecture checks
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build pinned Envoy + WAF image
        run: docker build --pull --tag envoyonsteroid:local .

      - name: Validate Envoy v3 bootstrap
        run: |
          docker run --rm --entrypoint envoy envoyonsteroid:local \
            --mode validate -c /etc/envoy/envoy.yaml

      - name: Integration smoke test
        run: |
          set -euo pipefail
          trap 'docker compose logs --no-color; docker compose down --volumes --remove-orphans' EXIT
          docker compose up --detach --no-build
          bash tests/smoke.sh
