name: Validation and WAF smoke test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not consume runner minutes validating superseded commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Both actions are pinned to verified release commit SHAs (not moving tags).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Static configuration and architecture checks
        run: |
          bash -n tests/smoke.sh
          .venv/bin/python -m unittest discover -s tests -v

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build pinned Envoy + WAF image
        run: docker build --pull --tag envoyonsteroid:local .

      - name: Validate Envoy v3 bootstrap
        run: |
          docker run --rm --entrypoint envoy envoyonsteroid:local \
            --mode validate -c /etc/envoy/envoy.yaml

      - name: Integration smoke test
        run: |
          set -euo pipefail
          trap 'docker compose logs --no-color; docker compose down --volumes --remove-orphans' EXIT
          docker compose up --detach --no-build
          bash tests/smoke.sh
