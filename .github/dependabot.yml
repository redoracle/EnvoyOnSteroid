# Opens reviewable dependency PRs; major/incompatible upgrades are never merged automatically.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions remain individual reviewable PRs.
    groups:
      github-actions-maintenance:
        update-types:
          - minor
          - patch
