# Envoy v3 static configuration. Production deployments should supply their
# own upstream, TLS termination, admin access, and tuned WAF exclusions.
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                # The demonstration is internet-edge-like: never trust inbound XFF.
                # Deployments behind an authenticated reverse proxy must review
                # the trusted-hop configuration and source address semantics.
                use_remote_address: true
                xff_num_trusted_hops: 0
                # Normalize before Coraza rules and route matching; reject
                # encoded slash/backslash ambiguity instead of forwarding it.
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                # Intentional low-cardinality access logs: no URL, headers,
                # cookies, query strings, or client IP addresses are recorded.
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          response_code: "%RESPONSE_CODE%"
                          response_code_details: "%RESPONSE_CODE_DETAILS%"
                          duration_ms: "%DURATION%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          response_flags: "%RESPONSE_FLAGS%"
                # Bound header memory and slow-header connections from untrusted clients.
                # These demonstration limits require app-specific tuning for large cookies
                # and long-running or streaming requests.
                max_request_headers_kb: 32
                request_headers_timeout: 10s
                stream_idle_timeout: 60s
                common_http_protocol_options:
                  idle_timeout: 60s
                request_timeout: 30s
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          # Edge reference: prevent untrusted identity/proto
                          # headers from being interpreted by the upstream.
                          # Behind a trusted ingress, review this policy.
                          request_headers_to_remove:
                            - x-forwarded-for
                            - forwarded
                            - x-real-ip
                            - cf-connecting-ip
                            - fly-client-ip
                            - fastly-client-ip
                            - true-client-ip
                            - x-forwarded-host
                            - x-forwarded-proto
                            - x-forwarded-protocol
                            - x-forwarded-ssl
                          route:
                            cluster: backend
                            timeout: 15s
                http_filters:
                  # The WAF must execute BEFORE the router.
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: coraza_waf
                        root_id: ""
                        configuration:
                          "@type": type.googleapis.com/google.protobuf.StringValue
                          value: |
                            {
                              "directives_map": {
                                "default": [
                                  "Include @recommended-conf",
                                  "SecRuleEngine On",
                                  "Include @crs-setup-conf",
                                  "Include @owasp_crs/*.conf",
                                  "SecRule REQUEST_URI \"@streq /__waf_test_block\" \"id:1000001,phase:1,deny,status:403,log\"",
                                  "SecRule ARGS_POST:message \"@contains __waf_test_payload\" \"id:1000002,phase:2,deny,status:403,log,msg:'Demo form body rule'\"",
                                  "SecRule ARGS:json.message \"@contains __waf_test_payload\" \"id:1000003,phase:2,deny,status:403,log,msg:'Demo JSON body rule'\""
                                ]
                              },
                              "default_directives": "default"
                            }
                        vm_config:
                          runtime: envoy.wasm.runtime.v8
                          vm_id: coraza_vm
                          code:
                            local:
                              filename: /etc/envoy/coraza.wasm
                  # Coraza must examine incoming body chunks first. Buffer
                  # *after* Coraza but before the router, ensuring the
                  # upstream cannot receive request data before inspection.
                  # This reference does not support streaming/large uploads.
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes:
                        value: 131072
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: backend
                      port_value: 8080

# Administrative endpoints are intentionally unreachable from the host.
# Access explicitly from within the container when troubleshooting.
admin:
  access_log_path: /dev/null
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
